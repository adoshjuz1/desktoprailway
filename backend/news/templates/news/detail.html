<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ post.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">ALT UNIVERSITY NEWS</a>
        </div>
    </nav>

    <div class="container my-4">
        <a href="/" class="btn btn-secondary btn-sm mb-3">&larr; Назад к новостям</a>
        <div class="card shadow-sm p-4">
            <span class="badge bg-primary w-auto mb-2 align-self-start">{{ post.category.name }}</span>
            <h1>{{ post.title }}</h1>
            <p class="text-muted">{{ post.created_at|date:"d M Y, H:i" }}</p>
            {% if post.image %}
                <img src="{{ post.image.url }}" class="img-fluid rounded mb-4" style="max-height: 400px; object-fit: cover;">
            {% endif %}
            <div class="fs-5">
                {{ post.content|linebreaks }}
            </div>
        </div>
    </div>
</body>
</html>
